name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  ledger:
    name: Ledger integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install locked development tooling
        run: npm ci

      - name: Type-check native TypeScript sources
        run: npm run typecheck

      - name: Run tests (52-case golden settlement oracle + ledger rules)
        run: node --test "tests/*.test.mjs" "tests/*.test.ts"

      - name: Validate all picks, results, and correction chains
        run: node scripts/validate.mjs

      - name: Resolve public GitHub publication witness
        if: github.event_name == 'pull_request'
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)" = "public"
          run_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .head_sha)"
          test "$run_head_sha" = "$EXPECTED_HEAD_SHA"
          witness_time="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
            --jq '.jobs[] | select(.name == "Ledger integrity") | .started_at')"
          test -n "$witness_time"
          echo "witness_time=$witness_time" >> "$GITHUB_OUTPUT"
          echo "Public PR witness: head=$EXPECTED_HEAD_SHA job_started_at=$witness_time"

      - name: Enforce append-only inputs, two-hour picks, and post-kickoff results
        if: github.event_name == 'pull_request'
        run: >-
          node scripts/validate-pr.mjs "origin/${{ github.base_ref }}" HEAD
          --witness-time "${{ steps.publication.outputs.witness_time }}"
          --expected-head-sha "${{ github.event.pull_request.head.sha }}"

      - name: Rebuild derived settlements and standings
        run: |
          node scripts/settle.mjs
          node scripts/standings.mjs

      - name: Require derived files to be current
        run: git diff --exit-code -- settlements standings
