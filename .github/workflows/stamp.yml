name: Anchor manifest

on:
  schedule:
    # Shortly after UTC midnight. Every run snapshots the complete formal pick
    # ledger at origin/main; a delayed run therefore still covers all history.
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anchor-manifest
  cancel-in-progress: false

jobs:
  stamp:
    name: Manifest + OpenTimestamps
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Update the unprotected public anchor branch from main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git fetch origin anchors; then
            git switch --force-create anchors origin/anchors
            git merge --no-edit origin/main
          else
            git switch --create anchors origin/main
          fi

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install OpenTimestamps client
        run: python -m pip install --quiet opentimestamps-client==0.7.2

      - name: Build complete ledger-state manifest
        run: node scripts/manifest.mjs "$(date -u +%F)" "$(git rev-parse origin/main)"

      - name: Discard stale receipts if a manifest changed
        run: |
          for f in manifests/*.txt; do
            [ -f "$f" ] || continue
            if ! git diff --quiet -- "$f"; then
              rm -f "$f.ots"
            fi
          done

      - name: Stamp new manifests and upgrade pending attestations
        run: |
          for f in manifests/*.txt; do
            [ -f "$f" ] || continue
            [ -f "$f.ots" ] || ots stamp "$f"
          done
          for f in manifests/*.ots; do
            [ -f "$f" ] || continue
            ots upgrade "$f" || true
          done

      - name: Commit anchored artifacts to the public anchor branch
        run: |
          git add manifests
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "anchor: ledger-state snapshot $(date -u +%F)"
            git push origin anchors
          fi
