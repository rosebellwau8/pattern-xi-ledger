name: Anchor manifest

on:
  schedule:
    # Daily at 21:30 UTC (05:30 Beijing) — after the European matchday evening.
    - cron: "30 21 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "picks/**"

permissions:
  contents: write

concurrency:
  group: anchor-manifest
  cancel-in-progress: false

jobs:
  stamp:
    name: Manifest + OpenTimestamps
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install OpenTimestamps client
        run: python -m pip install --quiet opentimestamps-client

      - name: Build today's manifest (skips itself when no picks were created today)
        run: node scripts/manifest.mjs

      - name: Stamp new manifests and upgrade pending attestations
        run: |
          for f in manifests/*.txt; do
            [ -f "$f.ots" ] || ots stamp "$f"
          done
          for f in manifests/*.ots; do
            [ -f "$f" ] || continue
            ots upgrade "$f" || true
          done

      - name: Commit anchored artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "anchor: daily manifest $(date -u +%F)"
            git push
          fi
